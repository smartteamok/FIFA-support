<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Request submitted | FIFA Foundation</title>
    <meta name="description" content="Confirmation for a FIFA Foundation Digital Education Programme support request.">
    <link rel="stylesheet" href="success.css">
  </head>
  <body>
    <main class="confirmation-shell">
      <section class="confirmation-card" aria-labelledby="confirmation-title">
        <img src="../assets/fifa-foundation-logo.png" alt="FIFA Foundation" width="220" height="102">
        <p class="eyebrow">FIFA FOUNDATION</p>
        <h1 id="confirmation-title" data-i18n="title">Request submitted</h1>
        <p class="lead" data-i18n="lead">Your support request was sent successfully.</p>

        <dl class="summary-list">
          <div>
            <dt data-i18n="kitId">Kit ID</dt>
            <dd id="kit-id">-</dd>
          </div>
          <div>
            <dt data-i18n="kitType">Kit type</dt>
            <dd id="kit-type">-</dd>
          </div>
          <div id="reference-row" hidden>
            <dt data-i18n="reference">Reference</dt>
            <dd id="reference">-</dd>
          </div>
        </dl>

        <p class="note" data-i18n="note">The support team will review the report and contact the email address provided in the form.</p>
        <a class="button" href="../" data-i18n="back">Back to support</a>
      </section>
    </main>
    <script src="success.js" defer></script>
  </body>
</html>
