<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Module guide | FIFA Foundation</title>
    <meta name="description" content="Module guide with operation video, wiring, program and troubleshooting for FIFA Foundation Digital Education Programme micro:bit kits.">
    <link rel="stylesheet" href="../resources.css">
    <link rel="stylesheet" href="../module.css">
  </head>
  <body class="module-page">
    <a class="skip-link" href="#module-content" data-i18n="skipToGuide">Skip to the guide</a>
    <header class="resources-header">
      <nav class="topbar" aria-label="Module navigation">
        <a class="brand" href="/dep-support/" aria-label="Back to FIFA Foundation support">
          <img src="/dep-support/assets/fifa-foundation-logo.png" alt="FIFA Foundation" width="220" height="102">
        </a>
        <div class="topbar-actions">
          <a class="back-link" href="/dep-support/resources/" data-i18n="backToList">Back to guides</a>
          <label class="language-picker">
            <span data-i18n="languageLabel">Language</span>
            <select id="language-select" aria-label="Language">
              <option value="en">EN</option>
              <option value="fr">FR</option>
              <option value="es">ES</option>
              <option value="pt">PT</option>
            </select>
          </label>
        </div>
      </nav>
      <div class="module-hero">
        <div class="module-hero-text">
          <nav class="breadcrumbs" id="breadcrumbs" aria-label="Breadcrumb"></nav>
          <p class="eyebrow" id="module-kit"></p>
          <h1 id="module-name"></h1>
          <p class="hero-copy" id="module-summary"></p>
          <ul class="chip-row" id="module-chips"></ul>
        </div>
        <figure class="module-hero-figure">
          <img id="module-photo" src="" alt="" width="320" height="320">
        </figure>
      </div>
    </header>
    <main class="module-main">
      <div class="module-content" id="module-content"></div>
      <aside class="module-aside" id="module-aside"></aside>
    </main>
    <footer class="site-footer">
      <p data-i18n="footerService">FIFA Foundation &amp; Raco Systems Corp. support service.</p>
      <p><a href="/dep-support/" data-i18n="support">Support</a><span aria-hidden="true">/</span><a href="mailto:support@smartteamdigital.com" data-i18n="contact">Contact</a></p>
    </footer>
    <script src="../components.data.js" defer></script>
    <script src="../modules.data.js" defer></script>
    <script src="../modules.text.js" defer></script>
    <script src="../module.js" defer></script>
  </body>
</html>
